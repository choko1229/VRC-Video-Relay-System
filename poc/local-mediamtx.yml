# PoC用: 配信主PC側(ローカル)MediaMTX設定
# OBSからのRTMP受信専用。127.0.0.1限定で外部公開しない。
#
# 実行: mediamtx.exe local-mediamtx.yml

logLevel: info

# 127.0.0.1限定でリッスン(外部からのアクセス不可)
rtmp: yes
rtmpAddress: 127.0.0.1:1935

# 他プロトコルはPoCでは不要なので無効化
# (アドレスを空にするだけでは「有効なのにアドレス未設定」エラーになるため、
#  対応する真偽値も明示的にnoにする必要がある)
rtsp: no
hls: no
webrtc: no
srt: no
moq: no

paths:
  obs_local:
    source: publisher
