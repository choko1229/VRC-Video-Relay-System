{% extends "base.html" %}
{% block title %}パスワード設定 - VRC配信中継システム{% endblock %}
{% block content %}
<div class="card">
    <h1>パスワード設定</h1>

    {% if error %}
    <div class="flash flash-error">{{ error }}</div>
    {% elif done %}
    <div class="flash flash-success">パスワードを設定しました。Windowsアプリからログインできます。</div>
    {% else %}
    <form method="post" action="/set-password">
        <input type="hidden" name="token" value="{{ token }}">
        <label for="password">新しいパスワード(8文字以上)</label>
        <input type="password" id="password" name="password" required minlength="8" maxlength="128">
        <button type="submit">設定する</button>
    </form>
    {% endif %}
</div>
{% endblock %}
