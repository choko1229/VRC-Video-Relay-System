{% extends "base.html" %}
{% block title %}利用申請 - VRC配信中継システム{% endblock %}
{% block content %}
<div class="card">
    <h1>利用申請</h1>
    <p class="muted">
        利用申請・ログインはDiscordアカウントでの認証が必須です。ボタンを押すとDiscordの
        認証画面に移動します。認証後、配信URLに使うユーザー名を決めて申請が完了します。
    </p>

    <a class="btn" href="/oauth/discord/apply/start">Discordで申請する</a>
</div>
{% endblock %}
