<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VRC配信中継システム{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
    {% block nav %}
    <div class="nav">
        <strong>VRC配信中継</strong>
        <a href="/apply">利用申請</a>
        <a href="/status">申請状況確認</a>
        {% if admin %}
            <a href="/admin/users/pending">承認待ち</a>
            <a href="/admin/users">ユーザー管理</a>
            <a href="/admin/streams">配信状況</a>
            <span style="flex:1"></span>
            <a href="/logout">ログアウト({{ admin.username }})</a>
        {% else %}
            <span style="flex:1"></span>
            <a href="/login">管理者ログイン</a>
        {% endif %}
    </div>
    {% endblock %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
