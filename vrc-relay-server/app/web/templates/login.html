{% extends "base.html" %}
{% block title %}管理者ログイン - VRC配信中継システム{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:40px auto">
    <h1>管理者ログイン</h1>

    {% if error %}
    <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <p class="muted">管理者として登録済みのDiscordアカウントでログインしてください。</p>
    <a class="btn" href="/oauth/discord/admin-login/start">Discordでログイン</a>
</div>
{% endblock %}
