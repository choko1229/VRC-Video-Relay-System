# 公開サーバーMediaMTX設定(本番相当)
# パスの動的add/deleteは配信中に他ユーザーを切断する既知の不具合報告があるため使用しない。
# ワイルドカードパス(~^live_.*$)＋外部HTTP認証の方式を採用する。

logLevel: info

# --- 外部HTTP認証 ---
# authHTTPAddressを設定するだけでは有効にならず、authMethodをhttpに切り替える必要がある
# (デフォルトはinternalで、authHTTPAddressの設定自体は無視される)
# MediaMTXはappと同一コンテナ/プロセスグループで起動する運用のため127.0.0.1で到達できる。
# ポート番号はAPP_PORTによって変わるため、ここには書かずMTX_AUTHHTTPADDRESS環境変数で
# 上書きする(起動スクリプト側で `http://127.0.0.1:${APP_PORT}/internal/mediamtx/auth` を設定する)。
authMethod: http
authHTTPAddress: http://127.0.0.1:8000/internal/mediamtx/auth
authHTTPExclude:
  # MVP方針: 視聴(read)側は認証なし。RTSPS利用時はTLS暗号化とパス名の非公開性で担保するが、
  # 非暗号フォールバック(rtspAddress)利用時は通信内容の暗号化は無い(パス名の非公開性のみ)。
  # (仕様書8章の未決事項として、コミュニティ規模拡大時は要再検討)
  - action: read
    path:

# --- RTMP(配信主PC側 relay_client.py からのpush受信) ---
rtmp: yes
rtmpAddress: :1935

# --- RTSP/RTSPS(VRChat ProTV等からの再生用) ---
# rtspsAddressを設定するだけではRTSPSリスナーは起動せず、rtspEncryptionを
# strict/optionalにする必要がある(デフォルトはno=RTSPSリスナー無効)。
# rtspAddress(平文)はRTSPS非対応環境向けの非暗号フォールバックとして公開する。
# 標準ポート(554)にしておけばプレイヤー側でポート省略できる(トパーズチャット等と同じ方式)。
# 実際のポートは環境ごとに変わりうるため、起動スクリプト側でMTX_RTSPADDRESS環境変数により
# 上書きする(PUBLIC_RTSP_PLAIN_PORTに合わせる)。
rtsp: yes
rtspEncryption: optional
rtspAddress: :554
rtspsAddress: :8322
# TLS証明書はMediaMTX自身で保持する(RTSPSはHTTPではないためCloudflare Tunnel等を経由できず、直接ポート公開する)
# パスはこのmediamtx.ymlと同じディレクトリ(mediamtx/)からの相対パス。
# server.crt/server.keyをこのディレクトリに配置すること。
rtspServerCert: server.crt
rtspServerKey: server.key

# 未使用プロトコルは無効化(アドレスを空にするだけでは
# 「有効なのにアドレス未設定」エラーになるため、対応する真偽値も明示的にnoにする)
hls: no
webrtc: no
srt: no
moq: no

# --- HTTP API(管理パネルからのpaths一覧・kick等に使用) ---
api: yes
apiAddress: :9997

paths:
  "~^live_.*$":
    source: publisher
