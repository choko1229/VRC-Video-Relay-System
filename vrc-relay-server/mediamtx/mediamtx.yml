# 公開サーバーMediaMTX設定(本番相当)
# パスの動的add/deleteは配信中に他ユーザーを切断する既知の不具合報告があるため使用しない。
# ワイルドカードパス(~^live_.*$)＋外部HTTP認証の方式を採用する。

logLevel: info

# --- 外部HTTP認証 ---
authHTTPAddress: http://app:8000/internal/mediamtx/auth
authHTTPExclude:
  # MVP方針: 視聴(read)側は認証なし。RTSPSのTLS暗号化とパス名の非公開性で担保する。
  # (仕様書8章の未決事項として、コミュニティ規模拡大時は要再検討)
  - action: read

# --- RTMP(配信主PC側 relay_client.py からのpush受信) ---
rtmpAddress: :1935

# --- RTSP/RTSPS(VRChat ProTV等からの再生用) ---
rtspAddress: :8554
rtspsAddress: :8322
# TLS証明書はnginxでの終端ではなくMediaMTX自身で保持する(RTSPSはHTTPではないためnginx越しにできない)
serverCert: /certs/server.crt
serverKey: /certs/server.key

# 未使用プロトコルは無効化
hlsAddress: ""
webrtcAddress: ""
srtAddress: ""

# --- HTTP API(管理パネルからのpaths一覧・kick等に使用) ---
api: yes
apiAddress: :9997

paths:
  "~^live_.*$":
    source: publisher
