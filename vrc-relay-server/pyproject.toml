[project]
name = "vrc-relay-server"
version = "0.1.0"
description = "VRC配信中継システム 公開サーバー"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "passlib[argon2]>=1.7",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false
