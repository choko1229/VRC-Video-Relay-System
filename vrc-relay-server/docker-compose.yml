services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vrc_relay
      MYSQL_USER: vrc_relay
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_me_root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web管理パネル/APIはポート開放せず、同梱したcloudflaredでCloudflare Tunnel経由で公開する
  # (TLS終端・公開ホスト名の割り当てはCloudflare Zero Trustダッシュボード側で設定する。
  #  トンネルのpublic hostnameのServiceは http://app:${APP_PORT} を指すよう設定すること)
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_PORT: ${APP_PORT:-8000}
    # 初期セットアップ画面(/setup)が.envにDB接続情報等を書き込むため、
    # コンテナ再作成後も残るようホストの.envをそのままマウントする
    # (事前に`cp .env.example .env`でファイルとして存在させておくこと。
    #  存在しないとDockerがディレクトリとして作成してしまうため)
    volumes:
      - ./.env:/app/.env
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "${APP_PORT:-8000}"

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./certs:/certs:ro
    ports:
      - "1935:1935"   # RTMP(配信主PC relay_clientからのpush)
      - "8322:8322"   # RTSPS(VRChat再生用)
    expose:
      - "8554"  # RTSP(平文)。VRC側はRTSPSを使う想定なので外部公開しない
      - "9997"  # HTTP API。管理パネル(app)からのみ利用するので外部公開しない

volumes:
  mysql_data:
