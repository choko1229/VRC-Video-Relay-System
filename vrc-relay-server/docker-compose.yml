services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vrc_relay
      MYSQL_USER: vrc_relay
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_me_root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web管理パネル/APIはポート開放せず、同梱したcloudflaredでCloudflare Tunnel経由で公開する
  # (TLS終端・公開ホスト名の割り当てはCloudflare Zero Trustダッシュボード側で設定する。
  #  トンネルのpublic hostnameのServiceは http://app:${APP_PORT} を指すよう設定すること)
  # MediaMTX(RTMP/RTSPS/HTTP API)も同一コンテナ内で同時起動する(docker-entrypoint.sh参照)。
  # HTTP API(9997)はlocalhost経由でしか使わないため公開ポートは不要。
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_PORT: ${APP_PORT:-8000}
    # 初期セットアップ画面(/setup)が.envにDB接続情報等を書き込むため、
    # コンテナ再作成後も残るようホストの.envをそのままマウントする
    # (事前に`cp .env.example .env`でファイルとして存在させておくこと。
    #  存在しないとDockerがディレクトリとして作成してしまうため)
    # server.crt/server.keyはmediamtx.ymlと同じディレクトリに個別マウントする
    # (ディレクトリごとマウントするとイメージに焼き込んだmediamtx.ymlが隠れてしまうため)
    volumes:
      - ./.env:/app/.env
      - ./certs/server.crt:/app/mediamtx/server.crt:ro
      - ./certs/server.key:/app/mediamtx/server.key:ro
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "1935:1935"   # RTMP(配信主PC relay_clientからのpush)
      - "8322:8322"   # RTSPS(VRChat再生用)
    expose:
      - "${APP_PORT:-8000}"

volumes:
  mysql_data:
