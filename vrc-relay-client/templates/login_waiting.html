<!doctype html>
<html lang="ja"{% if current_theme() != "system" %} data-theme="{{ current_theme() }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン中 - VRChat Live Relay</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container" style="max-width:360px;margin:72px auto 0">
        <div class="login-brand">
            <span>VRChat Live Relay</span>
        </div>
        <div class="login-card fade-in-up">
            <h1>ブラウザでログインしてください</h1>
            <p class="muted">既定のブラウザでDiscordのログイン画面を開きました。ログインが完了すると、この画面から自動的に進みます。</p>
            <a href="/login" class="btn btn-secondary btn-block" style="text-decoration:none;text-align:center;">ブラウザをもう一度開く</a>
        </div>
    </div>
    <script>
        async function poll() {
            try {
                const res = await fetch("/login/status");
                const data = await res.json();
                if (data.authenticated) {
                    window.location.href = "/";
                    return;
                }
            } catch (e) {
                // ネットワーク一時エラー等は無視してポーリングを継続する
            }
            setTimeout(poll, 1500);
        }
        poll();
    </script>
</body>
</html>
