{% import "icons.html" as icons %}
<!doctype html>
<html lang="ja"{% if current_theme() != "system" %} data-theme="{{ current_theme() }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>エラー - VRC配信中継クライアント</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container" style="max-width:360px;margin:72px auto 0">
        <div class="login-brand">
            {{ icons.relay("login-brand-mark") }}
            <span>VRC配信中継</span>
        </div>
        <div class="login-card fade-in-up">
            <h1>エラーが発生しました</h1>
            <div class="flash flash-error">{{ message }}</div>
            <p class="muted">アプリの再起動は不要です。下のボタンから続けられます。</p>
            <a href="/" class="btn btn-block" style="text-decoration:none;text-align:center;">トップに戻る</a>
        </div>
    </div>
</body>
</html>
