{% import "icons.html" as icons %}
<!doctype html>
<html lang="ja"{% if current_theme() != "system" %} data-theme="{{ current_theme() }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン - VRC配信中継クライアント</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container" style="max-width:360px;margin-top:72px">
        <div class="login-brand">
            {{ icons.relay("login-brand-mark") }}
            <span>VRC配信中継</span>
        </div>
        <div class="card fade-in-up">
            <h1>ログイン</h1>

            {% if error %}
            <div class="flash flash-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login">
                <label for="server_url">公開サーバーURL</label>
                <input type="text" id="server_url" name="server_url" required placeholder="https://your-public-server.example.com" value="{{ server_url or '' }}">

                <label for="username">ユーザー名</label>
                <input type="text" id="username" name="username" required value="{{ username or '' }}">

                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="btn-block">ログイン</button>
            </form>
        </div>
    </div>
</body>
</html>
