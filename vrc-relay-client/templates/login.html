{% import "icons.html" as icons %}
<!doctype html>
<html lang="ja"{% if current_theme() != "system" %} data-theme="{{ current_theme() }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン - VRC配信中継クライアント</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container" style="max-width:360px;margin:72px auto 0">
        <div class="login-brand">
            {{ icons.relay("login-brand-mark") }}
            <span>VRC配信中継</span>
        </div>
        <div class="login-card fade-in-up">
            <h1>ログイン</h1>
            <p class="muted">Discordアカウントでログインします。事前に公開サーバーで利用申請・承認が必要です。</p>

            {% if error %}
            <div class="flash flash-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login">
                <button type="submit" class="btn-block">Discordでログイン</button>
            </form>
        </div>
    </div>
</body>
</html>
