[project]
name = "vrc-relay-client"
version = "0.1.0"
description = "VRC配信中継システム Windowsクライアントアプリ"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pywebview>=5.3",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pywin32>=308; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8.3",
]

[tool.uv]
package = false
